# Local development database only. Staging and production use managed PostgreSQL.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bki
      POSTGRES_PASSWORD: bki
      POSTGRES_DB: bki_academy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
